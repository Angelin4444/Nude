<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NUDE — Skin Consultation</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

</head>

<body class="quiz-page">

    <header class="nav">

        <a href="index.html" class="logo">
            NUDE<span>.</span>
        </a>

        <div class="quiz-progress">

            <span id="questionNumber">
                01
            </span>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <span>
                04
            </span>

        </div>

        <a href="index.html" class="nav-small">
            Exit
        </a>

    </header>


    <main class="quiz-container">

        <!-- QUESTION -->
        <section class="question-screen" id="questionScreen">

            <div class="question-meta">
                SKIN CONSULTATION
            </div>

            <h1 id="questionTitle">
                How would you describe
                your skin?
            </h1>

            <p id="questionDescription">
                Choose the option that feels closest
                to your skin most days.
            </p>


            <div class="answer-grid" id="answerGrid">
            </div>


            <div class="quiz-footer">

                <button
                    class="back-button"
                    id="backButton"
                    type="button">
                    ← Back
                </button>

                <span>
                    Select an answer to continue
                </span>

            </div>

        </section>


        <!-- LOADING -->
        <section class="analysis-screen hidden" id="analysisScreen">

            <div class="analysis-orbit">

                <div class="orbit-inner">
                    NUDE
                </div>

            </div>

            <p class="eyebrow">
                READING YOUR PROFILE
            </p>

            <h2>
                A moment.
            </h2>

            <div class="analysis-items">

                <span id="analysisOne">
                    ○ Skin profile
                </span>

                <span id="analysisTwo">
                    ○ Your goals
                </span>

                <span id="analysisThree">
                    ○ Environment
                </span>

            </div>

        </section>

    </main>


    <script src="js/quiz.js"></script>

</body>
</html>
